<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Админка блога</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f4f4f4;
            color: #0d0d0d;
            font-family: Arial, sans-serif;
        }
        main {
            width: min(680px, calc(100vw - 32px));
            border: 1px solid #0d0d0d;
            background: #fff;
            padding: 40px;
        }
        h1 {
            margin: 0 0 16px;
            font-size: clamp(32px, 7vw, 72px);
            line-height: 0.9;
            text-transform: uppercase;
        }
        p {
            font-size: 18px;
            line-height: 1.5;
        }
        a {
            display: inline-block;
            margin-top: 24px;
            padding: 18px 22px;
            border: 1px solid #0d0d0d;
            color: #0d0d0d;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
        }
        a:hover {
            background: #0d0d0d;
            color: #fff;
        }
    </style>
</head>
<body>
    <main>
        <h1>Админка блога</h1>
        <p>Материалы редактируются через Pages CMS. Войдите через GitHub, выберите репозиторий `Nefedorb/evgenbond-site` и коллекцию “Блог”.</p>
        <a href="https://app.pagescms.org/" rel="noopener noreferrer">Открыть Pages CMS</a>
    </main>
</body>
</html>
