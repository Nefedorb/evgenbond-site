media:
  - name: images
    label: Изображения блога
    input: assets/blog
    output: /assets/blog
    extensions: [jpg, jpeg, png, webp]
    rename: safe
  - name: downloads
    label: Файлы для скачивания
    input: assets/downloads
    output: /assets/downloads
    extensions: [pdf, doc, docx, rtf, odt, xls, xlsx, ods, csv, ppt, pptx, odp, txt, md, html, htm, json, xml, zip]
    rename: safe

content:
  - name: blog
    label: Блог
    type: collection
    path: content/blog
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-{slug}.md"
      field: create
    view:
      primary: title
      fields: [date, published, slug]
      sort: date
      order: desc
    fields:
      - name: title
        label: Заголовок
        type: string
        required: true
      - name: slug
        label: URL slug
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          message: "Только латиница, цифры и дефисы, например: site-redesign-checklist"
      - name: date
        label: Дата публикации
        type: date
        required: true
      - name: published
        label: Опубликовано
        type: boolean
        required: true
        default: true
      - name: description
        label: Описание для SEO и shared link
        type: text
        required: true
        options:
          minlength: 40
          maxlength: 180
      - name: coverImage
        label: Обложка для сетки и статьи
        type: image
        required: true
        description: "Видимая картинка: используется в карточке блога и, если включено, в начале статьи."
        options:
          media: images
      - name: coverImageAlt
        label: Alt-текст обложки
        type: string
        required: true
      - name: showCoverInArticle
        label: Показывать обложку в статье
        type: boolean
        required: true
        default: true
      - name: showCoverBorder
        label: Показывать рамку у обложки
        type: boolean
        required: true
        default: true
      - name: sharedImage
        label: Картинка shared link
        type: image
        required: true
        description: "Только для сниппетов соцсетей и мессенджеров. В самой статье не публикуется."
        options:
          media: images
      - name: sharedImageAlt
        label: Alt-текст shared link картинки
        type: string
        required: true
      - name: tags
        label: Теги
        type: string
        list: true
      - name: blocks
        label: Блоки статьи
        type: block
        list: true
        blockKey: type
        required: true
        blocks:
          - name: text
            label: Текст
            fields:
              - name: body
                label: Текстовый блок
                type: rich-text
                required: true
                options:
                  format: markdown
                  switcher: true
                  media: false
          - name: image
            label: Изображение
            fields:
              - name: image
                label: Изображение
                type: image
                required: true
                options:
                  media: images
              - name: alt
                label: Alt-текст
                type: string
                required: true
              - name: caption
                label: Подпись
                type: string
              - name: showBorder
                label: Показывать рамку
                type: boolean
                default: true
              - name: size
                label: Размер
                type: select
                default: normal
                options:
                  values:
                    - name: normal
                      label: Обычный
                    - name: full
                      label: На всю ширину
          - name: video
            label: Видео
            fields:
              - name: provider
                label: Платформа
                type: select
                required: true
                default: youtube
                options:
                  values:
                    - name: youtube
                      label: YouTube
                    - name: kinescope
                      label: Kinescope
                    - name: custom
                      label: Custom embed URL
              - name: url
                label: Ссылка на видео или embed URL
                type: string
                required: true
                description: "YouTube/Kinescope можно вставлять обычной ссылкой. Для custom нужен только https embed URL, не iframe-код."
              - name: title
                label: Заголовок видео
                type: string
                required: true
              - name: caption
                label: Подпись
                type: string
              - name: size
                label: Размер
                type: select
                default: normal
                options:
                  values:
                    - name: normal
                      label: Обычный
                    - name: full
                      label: На всю ширину
          - name: code
            label: Код
            fields:
              - name: language
                label: Язык
                type: string
                description: "Например: html, css, javascript, powershell."
              - name: caption
                label: Подпись
                type: string
              - name: code
                label: Код
                type: code
                required: true
                options:
                  format: markdown
          - name: quote
            label: Цитата
            fields:
              - name: text
                label: Текст цитаты
                type: text
                required: true
              - name: author
                label: Автор
                type: string
          - name: divider
            label: Разделитель
            fields:
              - name: label
                label: Подпись
                type: string
          - name: download
            label: Скачать файл
            fields:
              - name: file
                label: Файл
                type: file
                required: true
                description: "Документы, таблицы, презентации, текстовые файлы или ZIP до 20 МБ."
                options:
                  media: downloads
                  extensions: [pdf, doc, docx, rtf, odt, xls, xlsx, ods, csv, ppt, pptx, odp, txt, md, html, htm, json, xml, zip]
              - name: title
                label: Заголовок
                type: string
                required: true
              - name: description
                label: Описание
                type: text
